<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mon Budget a déménagé</title>
<meta http-equiv="refresh" content="1; url=https://monbudget-app.github.io/">
<style>body{font:16px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px;text-align:center}a{color:#00a862;font-weight:700}</style>
<script>
try{navigator.serviceWorker&&navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})})}catch(e){}
try{caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})})}catch(e){}
location.replace('https://monbudget-app.github.io/');
</script>
</head>
<body><p>Mon Budget a une nouvelle adresse :<br><a href="https://monbudget-app.github.io/">monbudget-app.github.io</a></p></body>
</html>
